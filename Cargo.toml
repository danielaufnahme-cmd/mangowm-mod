[package]
name = "mangowm-mod"
version = "1.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Daniel <geonix.software@proton.me>"]
description = "Fast, native MangoWM configuration manager and Mangobar/Waybar bar builder written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/danielaufnahme-cmd/mangowm-mod"

[[bin]]
name = "mangowm-mod"
path = "src/main.rs"

[[bin]]
name = "mangowm-mod-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[lib]
name = "mangowm_mod"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
colored = "2.1"
anyhow = "1.0"
# GTK4 / libadwaita settings window (`--features gui`); never part of the CLI build.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"], optional = true }

[features]
default = []
gui = ["dep:gtk", "dep:adw"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
