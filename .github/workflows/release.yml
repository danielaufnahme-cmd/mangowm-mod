name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset="mangowm-mod-${{ matrix.target }}.tar.gz"
          strip "target/${{ matrix.target }}/release/mangowm-mod"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" mangowm-mod
          sha256sum "$asset" > "$asset.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset="mangowm-mod-${{ matrix.target }}.tar.gz"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
