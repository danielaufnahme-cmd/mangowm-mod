name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check install.sh syntax
        run: |
          sh -n install.sh
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -s sh install.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - run: cargo test --locked

  distros:
    runs-on: ubuntu-latest
    name: ${{ matrix.image }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            deps: dnf install -y curl gcc ca-certificates git tar gzip xz
          - image: ubuntu:24.04
            deps: apt-get update && apt-get install -y curl gcc ca-certificates git tar gzip xz-utils
          - image: debian:stable
            deps: apt-get update && apt-get install -y curl gcc ca-certificates git tar gzip xz-utils
          - image: archlinux:latest
            deps: pacman -Syu --noconfirm curl gcc ca-certificates git tar gzip xz
          - image: alpine:latest
            deps: apk add --no-cache curl gcc musl-dev ca-certificates git tar gzip xz
          - image: opensuse/tumbleweed
            deps: zypper --non-interactive install curl gcc ca-certificates git tar gzip xz
    steps:
      - name: Install prerequisites
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v4
      - name: Install Rust (rustup, minimal)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo test --locked

  static:
    name: static ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: target/${{ matrix.target }}/release/mangowm-mod --help
